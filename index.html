<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Domácí panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background-color: #050a12;
}
/* 1rem = 16px při výšce 768px, vše se škáluje podle displeje */
html { font-size: 2.083vmin; }

body {
  font-family: Roboto, "Droid Sans", Arial, Helvetica, sans-serif;
  color: #dbeafe;
  background: linear-gradient(180deg, #08121f 0%, #050a12 100%);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: .4rem;
}

/* ================= HLAVIČKA ================= */
#header {
  position: relative;
  flex: 0 0 5rem;
  display: flex;
  align-items: center;
  padding: 0 1rem;
  border-radius: .8rem;
  background: linear-gradient(90deg, #10233b 0%, #0a1626 100%);
  border: 1px solid #1d3552;
  overflow: hidden;
}

#clock {
  font-family: "Droid Sans Mono", "Courier New", monospace;
  font-weight: bold;
  font-size: 3.1rem;
  line-height: 1;
  letter-spacing: .05em;
  color: #35e0ff;
  text-shadow: 0 0 .5rem rgba(53, 224, 255, .4);
  white-space: nowrap;
}

#dateblk { margin-left: 1.5rem; line-height: 1.15; white-space: nowrap; }
#dn-day  { font-size: 1.55rem; font-weight: bold; color: #eaf5ff; }
#dn-date { font-size: 1.15rem; color: #7fa6c9; }

#nameday { flex: 1; min-width: 0; margin: 0 1rem; text-align: center; line-height: 1.1; white-space: nowrap; overflow: hidden; }
#sv-label { font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; color: #7fa6c9; }
#sv-name  { font-size: 2.7rem; font-weight: bold; color: #ffd24a; }
#sv-name.n1 { font-size: 2.7rem; }
#sv-name.n2 { font-size: 2.2rem; }
#sv-name.n3 { font-size: 1.8rem; }
#sv-name.n4 { font-size: 1.4rem; }

/* rodinné narozeniny / svátky - barevné blikání */
@keyframes famB { 0% { color: #ff4fd8; } 25% { color: #ffe14a; } 50% { color: #35e0ff; } 75% { color: #7dff7a; } 100% { color: #ff4fd8; } }
@keyframes famS { 0% { color: #ff9a3c; } 25% { color: #ffe14a; } 50% { color: #7dff7a; } 75% { color: #4fc3ff; } 100% { color: #ff9a3c; } }
@keyframes famBlink { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
#nameday.fam-b #sv-label, #nameday.fam-b #sv-name { animation: famB 2.4s linear infinite, famBlink 1s ease-in-out infinite; }
#nameday.fam-s #sv-label, #nameday.fam-s #sv-name { animation: famS 2.4s linear infinite, famBlink 1s ease-in-out infinite; }

#hdr-ctl { margin-left: 1.2rem; display: flex; align-items: center; }
#motion-dot {
  display: inline-block;
  width: .7rem; height: .7rem;
  border-radius: 50%;
  background-color: #113322;
  margin-right: .6rem;
}
#btn-fs {
  background-color: #0d2238;
  border: 1px solid #2a5075;
  border-radius: .4rem;
  color: #6fb8e6;
  font-size: .85rem;
  padding: .3rem .6rem;
}

#rfwrap { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background-color: #12304a; }
#rf { height: 100%; width: 0%; background-color: #35e0ff; }

/* ================= ROZLOŽENÍ ================= */
#main { flex: 1; display: flex; min-height: 0; margin-top: .4rem; }
#colL { flex: 1.08; display: flex; flex-direction: column; min-width: 0; margin-right: .4rem; }
#colR { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.card {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  margin-bottom: .4rem;
  padding: .65rem .9rem .6rem 1.3rem;
  border-radius: .8rem;
  background: linear-gradient(160deg, #122238 0%, #0a1524 100%);
  border: 1px solid #1b3350;
  display: flex;
  flex-direction: column;
}
.card:last-child { margin-bottom: 0; }
.card:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .35rem; }

.a-blue:before   { background-color: #5aa9ff; }
.a-cyan:before   { background-color: #29d3ff; }
.a-gold:before   { background-color: #ffc933; }
.a-purple:before { background-color: #c98bff; }
.a-green:before  { background-color: #4be37e; }

.f-fc  { flex-grow: 1.75; }
.f-out { flex-grow: 1; }
.f-sol { flex-grow: 1.1; }

.ctitle {
  display: flex;
  align-items: center;
  font-size: 1rem;
  font-weight: bold;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #86bdea;
  margin-bottom: .3rem;
  white-space: nowrap;
}
.ctitle .tr {
  margin-left: auto;
  font-size: .85rem;
  font-weight: normal;
  letter-spacing: 0;
  text-transform: none;
  color: #6f93b8;
}

/* ================= HODNOTY ================= */
.val { font-size: 4.6rem; font-weight: bold; line-height: 1; white-space: nowrap; }
.unit { font-size: .42em; font-weight: normal; color: #6f93b8; margin-left: .12em; }
.lbl { font-size: 1.05rem; color: #86acd0; }

.c-cyan   { color: #35e0ff; }
.c-orange { color: #ffa53a; }
.c-gold   { color: #ffd24a; }
.c-purple { color: #cf9aff; }
.c-green  { color: #5cea8b; }

.body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.body2 { flex: 1; display: flex; align-items: center; justify-content: space-between; }
.row2 { flex: 1; display: flex; min-height: 0; }
.half { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sep { width: 1px; background-color: #21405f; margin: .2rem .9rem; }

/* ================= TEPLOTNÍ LIŠTA ================= */
.bar {
  position: relative;
  height: .95rem;
  border-radius: .5rem;
  overflow: hidden;
  background: linear-gradient(90deg, #2d8cff 0%, #27d3c0 30%, #7ed957 50%, #ffc933 72%, #ff5a3c 100%);
}
.bar-mask {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 100%;
  background-color: #0a1320;
  border-left: 2px solid #eaf4ff;
}
.scale { display: flex; justify-content: space-between; font-size: .8rem; color: #56799b; margin-top: .15rem; }

/* ================= STAV DAT ================= */
.dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .4rem; }
.dg { background-color: #00ee66; }
.dy { background-color: #ffcc00; }
.dr { background-color: #ff3355; }

/* ================= VENKOVNÍ TEPLOTA ================= */
.mm { text-align: right; line-height: 1.25; }
.mm-l { font-size: .95rem; color: #6f93b8; text-transform: uppercase; letter-spacing: .12em; }
.mm .up, .mm .dn { font-size: 1.7rem; font-weight: bold; }
.mm .up { color: #ff9f5a; }
.mm .dn { color: #6ec6ff; }

/* ================= PŘEDPOVĚĎ ================= */
#fc-days { flex: 1; display: flex; min-height: 0; }
.fc-wait { margin: auto; color: #6f93b8; font-size: 1.2rem; }

.fc-day {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  margin-right: .4rem;
  padding: .45rem .2rem;
  border-radius: .65rem;
  background-color: #0d1a2a;
  border: 1px solid #17304a;
}
.fc-day:last-child { margin-right: 0; }
.fc-today { background-color: #14324d; border-color: #2d6f9c; }

.fc-name { font-size: 1.2rem; font-weight: bold; color: #eaf5ff; text-transform: uppercase; letter-spacing: .06em; }
.fc-ico  { width: 5.6rem; height: 5.6rem; }
.fc-ico svg { display: block; width: 100%; height: 100%; }
.fc-desc {
  height: 2.4rem;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  font-size: .98rem; line-height: 1.12;

.fc-max { font-size: 2.8rem; font-weight: bold; line-height: 1; color: #ff9f5a; }
.fc-min { font-size: 1.85rem; font-weight: bold; line-height: 1; color: #6ec6ff; }
.fc-rain { display: flex; align-items: center; font-size: 1.1rem; color: #8fd0ff; }
.fc-rain svg { width: 1rem; height: 1rem; margin-right: .3rem; }

#fc-tip {
  margin-top: .4rem;
  padding: .35rem .7rem;
  border-radius: .5rem;
  background-color: #2a2410;
  border: 1px solid #5a4a14;
  color: #ffd24a;
  font-style: italic;
  font-size: 1.1rem;
  line-height: 1.2;
  text-align: center;
  min-height: 2.2rem;

/* ================= ČERNÁ OBRAZOVKA / DETEKCE POHYBU ================= */
#blackout {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #000000;
  z-index: 9999;
  cursor: pointer;
}
#blackout-hint {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: #111111;
  font-size: .8rem;
}
#motion-video  { position: fixed; top: -9999px; left: -9999px; width: 80px; height: 60px; }
#motion-canvas { position: fixed; top: -9999px; left: -9999px; width: 80px; height: 60px; }

<script>

function px(t) { return PROXY + '?url=' + encodeURIComponent(t); }

function setEl(id, html) { var e = document.getElementById(id); if (e) e.innerHTML = html; }
function setW(id, w)     { var e = document.getElementById(id); if (e) e.style.width = w; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

// Fullscreen
function goFS() {
  var el = document.documentElement;
  if (el.requestFullscreen)            { el.requestFullscreen(); }
  else if (el.mozRequestFullScreen)    { el.mozRequestFullScreen(); }
  else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  else if (el.msRequestFullscreen)     { el.msRequestFullscreen(); }
}

// ============================================================
// DETEKCE POHYBU KAMEROU (beze změny)
// ============================================================
var SLEEP_AFTER  = 60;   // sekund bez pohybu → zčernání
var MOTION_THRESHOLD = 25; // citlivost (0-255, menší = citlivější)
var SAMPLE_W = 80;
var SAMPLE_H = 60;

var motionVideo    = document.getElementById('motion-video');
var motionCanvas   = document.getElementById('motion-canvas');
var motionCtx      = motionCanvas.getContext('2d');
var motionDot      = document.getElementById('motion-dot');
var blackout       = document.getElementById('blackout');
var lastMotionTime = new Date().getTime();
var prevPixels     = null;
var cameraOk       = false;
var sleeping       = false;

motionCanvas.width  = SAMPLE_W;
motionCanvas.height = SAMPLE_H;

function wakeUp() {
  sleeping = false;
  blackout.style.display = 'none';
  lastMotionTime = new Date().getTime();
  goFS();
}

function goSleep() {
  if (sleeping) return;
  sleeping = true;
  blackout.style.display = 'block';
  // Opust fullscreen pri spanku neni treba - blackout zakryje vse
}

function onMotionDetected() {
  lastMotionTime = new Date().getTime();
  motionDot.style.backgroundColor = '#00ee55';
  if (sleeping) { wakeUp(); }
  setTimeout(function() {
    if (!sleeping) motionDot.style.backgroundColor = '#113322';
  }, 500);
}

function checkMotion() {
  if (!cameraOk || !motionVideo.videoWidth) return;

  motionCtx.drawImage(motionVideo, 0, 0, SAMPLE_W, SAMPLE_H);
  var imageData = motionCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H);
  var pixels = imageData.data;

  if (prevPixels) {
    var diff = 0;
    var changed = 0;
    for (var i = 0; i < pixels.length; i += 4) {
      var dr = Math.abs(pixels[i]   - prevPixels[i]);
      var dg = Math.abs(pixels[i+1] - prevPixels[i+1]);
      var db = Math.abs(pixels[i+2] - prevPixels[i+2]);
      diff = (dr + dg + db) / 3;
      if (diff > MOTION_THRESHOLD) changed++;
    }
    // Pokud se zmenilo vic nez 1% pixelu = pohyb
    var totalPixels = SAMPLE_W * SAMPLE_H;
    if (changed > totalPixels * 0.01) {
      onMotionDetected();
    }
  }

  prevPixels = new Uint8ClampedArray(pixels);

  // Zkontroluj cas od posledniho pohybu
  var now = new Date().getTime();
  if (!sleeping && (now - lastMotionTime) > SLEEP_AFTER * 1000) {
    goSleep();
  }
}

function startCamera() {
  var constraints = { video: { facingMode: 'user', width: SAMPLE_W, height: SAMPLE_H }, audio: false };

  // Firefox 68 pouziva starsi API
  var nav = navigator;
  if (nav.mediaDevices && nav.mediaDevices.getUserMedia) {
    nav.mediaDevices.getUserMedia(constraints)
      .then(function(stream) {
        motionVideo.srcObject = stream;
        motionVideo.play();
        cameraOk = true;
        motionDot.style.backgroundColor = '#113322';
        setInterval(checkMotion, 500); // kontrola 2x za sekundu
      })
      .catch(function(err) {
        // Kamera nedostupna - jen timeout rezim bez kamery
        motionDot.style.backgroundColor = '#331111';
        startTimeoutOnly();
      });
  } else if (nav.getUserMedia) {
    // Starsi API
    nav.getUserMedia(constraints, function(stream) {
      motionVideo.src = window.URL.createObjectURL(stream);
      motionVideo.play();
      cameraOk = true;
      motionDot.style.backgroundColor = '#113322';
      setInterval(checkMotion, 500);
    }, function(err) {
      motionDot.style.backgroundColor = '#331111';
      startTimeoutOnly();
    });
  } else {
    startTimeoutOnly();
  }
}

// Záložní režim bez kamery - zhasne po X minutách, dotyk probudí
function startTimeoutOnly() {
  cameraOk = false;
  setInterval(function() {
    var now = new Date().getTime();
    if (!sleeping && (now - lastMotionTime) > SLEEP_AFTER * 1000) {
      goSleep();
    }
  }, 5000);
  // Jakýkoli dotyk/klik probudí
  document.addEventListener('touchstart', function() {
    lastMotionTime = new Date().getTime();
    if (sleeping) wakeUp();
  });
  document.addEventListener('click', function() {
    lastMotionTime = new Date().getTime();
    if (sleeping) wakeUp();
  });
}

function letTxt(n) { return n + (n === 1 ? ' rok' : ((n >= 2 && n <= 4) ? ' roky' : ' let')); }

// události, které mají být právě vidět: when = 1 (zítra) nebo 0 (dnes)
function computeFamily(now, list) {
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var out = [], i, k, y, occ, diff, p, d;
  for (i = 0; i < list.length; i++) {
    p = list[i];
    for (k = 0; k < 2; k++) {
      d = (k === 0) ? p.b : p.s;
      if (!d) continue;
      for (y = today.getFullYear(); y <= today.getFullYear() + 1; y++) {
        occ = new Date(y, d[1] - 1, d[0]);
        diff = Math.round((occ.getTime() - today.getTime()) / 86400000);
        if (diff === 0 || diff === 1) {
          out.push({ type: (k === 0 ? 'b' : 's'), when: diff, nick: p.nick,
                     age: (k === 0 && d[2]) ? (y - d[2]) : null });
        }
      }
    }
  }
  return out;
}

var famList = [], famIdx = 0;

function nameSize(txt) {
  var l = txt.length;
  return l <= 16 ? 'n1' : (l <= 20 ? 'n2' : (l <= 25 ? 'n3' : 'n4'));
}

function renderNameday() {
  var box = document.getElementById('nameday');

    ev = famList[famIdx % famList.length];
    label = (ev.when === 1 ? 'Zítra ' : 'Dnes ') + (ev.type === 'b' ? 'narozeniny' : 'svátek');
    if (ev.age !== null) label += ' · ' + letTxt(ev.age);
    name = ev.nick;
    box.className = 'fam fam-' + ev.type;
  } else {
    n = new Date();
    name = (SVATKY[n.getMonth()] || [])[n.getDate() - 1] || '';
    label = SPECIAL[name] ? 'Dnes' : 'Svátek má';
    box.className = '';
  }
  setEl('sv-label', label);
  setEl('sv-name', name ? name : '&nbsp;');
  nm.className = nameSize(name);
}

function updateSvatek() {
  famList = computeFamily(new Date(), FAMILY);
  if (famIdx >= famList.length) famIdx = 0;
  renderNameday();
}

// POMOCNÉ FUNKCE
// ============================================================
function getJSON(url, cb) {
  var done = false;
  var xhr  = new XMLHttpRequest();
  var tmr  = setTimeout(function() {
    if (done) return; done = true;
    try { xhr.abort(); } catch(e) {}
    cb('timeout', null);
  }, 15000);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    clearTimeout(tmr); if (done) return; done = true;
    if (xhr.status === 200) {
      try { cb(null, JSON.parse(xhr.responseText)); } catch(e) { cb('parse', null); }
    } else { cb('http ' + xhr.status, null); }
  };
  try { xhr.open('GET', url, true); xhr.send(); }
  catch(e) { clearTimeout(tmr); if (!done) { done = true; cb('open', null); } }
}

function fv(feeds, n) {
  if (!feeds || !feeds.length) return null;
  var v = feeds[0]['field' + n];
  if (v === null || v === undefined || v === '') return null;
  var f = parseFloat(v);
  return isNaN(f) ? null : f;
}

function ft(val) {
  if (val === null) return '---';
  return val.toFixed(1) + '<span class="unit">°C</span>';
}

function fmtT(v) { return (v === null) ? '–' : Math.round(v) + '°'; }

// maska odkrývá barevný přechod lišty podle hodnoty
function setBar(id, val, mn, mx) {
  var e = document.getElementById(id);
  if (!e) return;
  if (val === null) { e.style.width = '100%'; e.style.borderLeftWidth = '0'; return; }
  var p = (val - mn) / (mx - mn) * 100;
  if (p < 0) p = 0;
  if (p > 100) p = 100;
  e.style.width = (100 - p) + '%';
  e.style.borderLeftWidth = '2px';
}

function setAge(dotId, txtId, created) {
  if (!created) return;
  var dm = Math.round((new Date().getTime() - new Date(created).getTime()) / 60000);
  if (isNaN(dm)) return;
  if (dm < 0) dm = 0;
  setEl(txtId, dm < 60 ? 'před ' + dm + ' min' : 'před ' + Math.floor(dm / 60) + ' h');
  var d = document.getElementById(dotId);
  if (d) d.className = 'dot ' + (dm < 15 ? 'dg' : (dm < 60 ? 'dy' : 'dr'));
}

// ============================================================
// IKONY POČASÍ - kreslené SVG (emoji ve starém Androidu nefungují)
// ============================================================
function svgWrap(inner) {
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
}

function sunShape(cx, cy, r, rays) {
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffc933"/>';
  var i, a, c, sn;
  if (rays) {
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4; c = Math.cos(a); sn = Math.sin(a);
      s += '<line x1="' + (cx + c * (r + 4)).toFixed(1) + '" y1="' + (cy + sn * (r + 4)).toFixed(1) +
           '" x2="' + (cx + c * (r + 9)).toFixed(1) + '" y2="' + (cy + sn * (r + 9)).toFixed(1) +
           '" stroke="#ffc933" stroke-width="3" stroke-linecap="round"/>';
    }
  }
  return s;
}

function cloudShape(tx, ty, sc, fill) {
  return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + sc + ')" fill="' + fill + '">' +
    '<circle cx="22" cy="40" r="10"/><circle cx="35" cy="33" r="14"/><circle cx="47" cy="41" r="9"/>' +
    '<rect x="22" y="40" width="25" height="10"/></g>';
}

function dropLines(y, color, w, n) {
  var xs = [22, 34, 46], s = '', i;
  for (i = 0; i < n; i++) {
    s += '<line x1="' + xs[i] + '" y1="' + y + '" x2="' + (xs[i] - 3) + '" y2="' + (y + 8) +
         '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"/>';
  }
  return s;
}

function weatherSvg(kind) {
  var s = '', i, xs;
  if (kind === 'sun') {
    s = sunShape(32, 32, 12, true);
  } else if (kind === 'mostly') {
    s = sunShape(27, 27, 10, true) + cloudShape(20, 20, 0.6, '#e6eef7');
  } else if (kind === 'partly') {
    s = sunShape(24, 24, 9, true) + cloudShape(6, 8, 0.85, '#d3dde9');
  } else if (kind === 'fog') {
    s = cloudShape(0, -8, 0.9, '#aab9ca') +
        '<g stroke="#8fa3b8" stroke-width="3.5" stroke-linecap="round">' +
        '<line x1="12" y1="44" x2="52" y2="44"/><line x1="16" y1="52" x2="56" y2="52"/>' +
        '<line x1="12" y1="60" x2="44" y2="60"/></g>';
  } else if (kind === 'drizzle') {
    s = cloudShape(0, -6, 1, '#9fb2c7') + dropLines(48, '#6fc3ff', 2.5, 3);
  } else if (kind === 'rain') {
    s = cloudShape(0, -6, 1, '#8ea2b8') + dropLines(47, '#3fa9ff', 3.5, 3);
  } else if (kind === 'showers') {
    s = sunShape(22, 22, 8, true) + cloudShape(4, -2, 0.9, '#8ea2b8') + dropLines(46, '#3fa9ff', 3, 3);
  } else if (kind === 'snow') {
    s = cloudShape(0, -6, 1, '#a9b9cc');
    xs = [[22, 49], [34, 49], [46, 49], [28, 57], [40, 57]];
    for (i = 0; i < xs.length; i++) {
      s += '<circle cx="' + xs[i][0] + '" cy="' + xs[i][1] + '" r="2.4" fill="#ffffff"/>';
    }
  } else if (kind === 'storm') {
    s = cloudShape(0, -8, 1, '#64768d') +
        '<polygon points="36,40 26,53 33,53 29,63 43,48 36,48 41,40" fill="#ffd24a"/>';
  } else {
    s = cloudShape(14, 0, 0.75, '#6f8197') + cloudShape(-4, -3, 1.05, '#b4c3d4');
  }
  return svgWrap(s);
}

var DROP_SVG = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="M8 1 C8 1 2 8 2 11 a6 6 0 0 0 12 0 C14 8 8 1 8 1 z" fill="#4fb3ff"/></svg>';

function wInfo(code) {
  return WK[code] || {d: 'Počasí', k: 'cloud', h: 'Počasí nás dnes překvapuje!'};
}

function numAt(a, i) {
  if (!a || a[i] === null || a[i] === undefined) return null;
  return a[i];
}

function dayLabel(dateStr, i) {
  if (i === 0) return 'Dnes';
  if (i === 1) return 'Zítra';
  var p = dateStr.split('-');
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  return DAYS[d.getDay()];
}

function renderForecast(data) {
  if (!data || !data.daily || !data.daily.time) return false;
  var dl    = data.daily;
  var codes = dl.weather_code || dl.weathercode;
  var tmax  = dl.temperature_2m_max, tmin = dl.temperature_2m_min;
  var rain  = dl.precipitation_probability_max;
  var wind  = dl.wind_speed_10m_max || dl.windspeed_10m_max;
  if (!codes || !tmax || !tmin) return false;

  var html = '', i, n = Math.min(3, dl.time.length);
  for (i = 0; i < n; i++) {
    var info = wInfo(codes[i]);
    var r = numAt(rain, i);
    html += '<div class="fc-day' + (i === 0 ? ' fc-today' : '') + '">' +
      '<div class="fc-name">' + dayLabel(dl.time[i], i) + '</div>' +
      '<div class="fc-ico">' + weatherSvg(info.k) + '</div>' +
      '<div class="fc-desc">' + info.d + '</div>' +
      '<div class="fc-max">' + fmtT(numAt(tmax, i)) + '</div>' +
      '<div class="fc-min">' + fmtT(numAt(tmin, i)) + '</div>' +
      '<div class="fc-rain">' + DROP_SVG + '<span>' + (r === null ? '–' : Math.round(r) + ' %') + '</span></div>' +
      '</div>';
  }
  setEl('fc-days', html);

  // hláška dne (při silném větru přednost větru)
  var i0 = wInfo(codes[0]), w0 = numAt(wind, 0), tip = i0.h;
  if (w0 !== null && w0 >= 45 && i0.k !== 'storm') {
    tip = 'Dnes větrno (až ' + Math.round(w0) + ' km/h) – držte si klobouky!';
  }
  setEl('fc-tip', tip);

  // dnešní min/max do karty venkovní teploty
  setEl('out-mm', '<div class="mm-l">Dnes</div><div><span class="up">&#8593; ' + fmtT(numAt(tmax, 0)) +
        '</span> <span class="dn">&#8595; ' + fmtT(numAt(tmin, 0)) + '</span></div>');
  return true;
}

var fcRetry = null;
function loadForecast() {
  var t = 'https://api.open-meteo.com/v1/forecast?latitude=49.626&longitude=18.137' +
          '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' +
          '&timezone=Europe%2FPrague&forecast_days=3';
  getJSON(px(t), function(err, data) {
    if (err || !renderForecast(data)) {
      setEl('fc-tip', 'Předpověď nedostupná (' + (err || 'data') + ')');
      if (fcRetry) clearTimeout(fcRetry);
      fcRetry = setTimeout(loadForecast, 60000);
      return;
    }
    var n = new Date();
    setEl('fc-upd', 'akt. ' + pad(n.getHours()) + ':' + pad(n.getMinutes()));
  });
}

// ============================================================
var TICK = 60, tick = 0;
function loadAll() { loadSolar(); loadKotelna(); }

function tickBar() {
  tick++;
  setW('rf', Math.round(tick / TICK * 100) + '%');
  if (tick >= TICK) { tick = 0; setW('rf', '0%'); loadAll(); }
}

// předpověď každých 30 minut + při změně dne (svátek i popisky Dnes/Zítra)
var lastDay = new Date().getDate();
setInterval(function() {
  var d = new Date().getDate();
  if (d !== lastDay) { lastDay = d; updateSvatek(); loadForecast(); }
}, 30000);
setInterval(loadForecast, 30 * 60 * 1000);

loadAll();
loadForecast();
setInterval(tickBar, 1000);
